<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock paper Scissors Game</title>
    <link rel="stylesheet" href="styles/rps.css" />
  </head>

  <body>
    <p class="title">Rock Paper Scissors Game</p>

    <h2>You can use R,P,S on your keyboard to play</h2>

    <button class="move-button js-rock-button">
      <img
        class="move-icon"
        src="images/rock-emoji.png"
        alt="A yellow emoji hand displaying the rock move."
      />
    </button>

    <button class="move-button js-paper-button">
      <img
        class="move-icon"
        src="images/paper-emoji.png"
        alt="A yellow emoji hand displaying the paper move"
      />
    </button>

    <button class="move-button js-scissors-button">
      <img
        class="move-icon"
        src="images/scissors-emoji.png"
        alt="A yellow emoji hand displaying the scissors move"
      />
    </button>

    <p class="js-result" result></p>
    <p class="js-moves"></p>
    <p class="js-score score"></p>

    <button class="reset-score-button js-reset-score-button">
      Reset Score
    </button>

    <button class="auto-play-button js-auto-play-button">Auto Play</button>
  </body>
  <script src="scripts/rps.js"></script>
</html>
